<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Breed Profile | Purrpedia</title>
<!-- Light Browser Tabs -->
<link rel="icon" href="assets/icon-light.png" media="(prefers-color-scheme: light)" />

<!--Dark Browser Tabs -->
<link rel="icon" href="assets/icon-dark.png" media="(prefers-color-scheme: dark)" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1B1B3A;
            --ink-2: #2D2D5C;
            --mist: #E9E8F1;
            --mist-2: #DDDBEA;
            --paper: #FDFCFF;
            --saffron: #F2A93B;
            --text: #2A2A40;
            --muted: #6A6A86;
            --line: #D8D6E6;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--mist);
            color: var(--text);
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.05rem;
        }

        h1, h2, h3, h4, .navbar-brand, .back-btn, .info-label {
            font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
        }

        a:focus-visible, button:focus-visible {
            outline: 3px solid var(--saffron);
            outline-offset: 2px;
        }

        /* Navigation */
        .navbar {
            background-color: var(--ink);
            position: relative;
            padding: 12px 0;
        }

        .navbar-brand {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff !important;
        }

        .navbar-brand::before {
            content: "";
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--saffron);
            margin-right: 9px;
        }

        .navbar .nav-link {
            color: #D9D8EC;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 500;
            margin-left: 14px;
            border-bottom: 2px solid transparent;
            padding: 6px 2px;
        }

        .navbar .nav-link:hover {
            color: #fff;
            border-bottom-color: var(--saffron);
        }

        /* Profile Header */
        .profile-header {
            background-color: var(--ink);
            color: #fff;
            padding: 56px 15px 120px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: var(--ink-2);
            right: -100px;
            top: -160px;
        }

        .profile-header .container { position: relative; }

        .profile-header h1 {
            font-weight: 800;
            letter-spacing: -0.04em;
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            margin-bottom: 6px;
        }

        .profile-header p {
            margin-bottom: 0;
            color: #CFCEE6;
            font-style: italic;
            font-size: 1.15rem;
        }

        /* Main Profile */
        .profile-container {
            max-width: 1050px;
            margin: -80px auto 40px;
            padding: 0 15px;
            position: relative;
        }

        .profile-card {
            background-color: var(--paper);
            border-radius: 28px;
            padding: 36px;
            box-shadow: 0 24px 50px rgba(27, 27, 58, 0.18);
        }

        .profile-image {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 10px;
            border: 0;
            background-color: var(--mist);
            box-shadow: 0 24px 48px rgba(27, 27, 58, 0.3), 0 8px 16px rgba(27, 27, 58, 0.18);
        }

        .breed-name {
            color: var(--ink);
            font-size: clamp(2rem, 4vw, 2.9rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .breed-description {
            line-height: 1.75;
            color: var(--text);
            font-size: 1.12rem;
        }

        /* Information Sections */
        .info-section {
            margin-top: 30px;
            padding-top: 26px;
            border-top: 1px dashed var(--line);
        }

        .info-section h3 {
            color: var(--ink);
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .info-section .row { --bs-gutter-x: 0.9rem; --bs-gutter-y: 0.9rem; }

        .info-item {
            margin-bottom: 0;
        }

        .info-item > .info-label,
        .info-item > .info-value {
            padding-left: 16px;
            padding-right: 16px;
            background: var(--mist);
        }

        .info-item > .info-label {
            padding-top: 12px;
            border-radius: 14px 14px 0 0;
            border-left: 4px solid var(--saffron);
        }

        .info-item > .info-value {
            padding-bottom: 12px;
            border-radius: 0 0 14px 14px;
            border-left: 4px solid var(--saffron);
        }

        .info-label {
            display: block;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 0;
        }

        .info-value {
            display: block;
            color: var(--ink);
            line-height: 1.6;
        }

        .temperament-tag {
            display: inline-block;
            background-color: var(--mist);
            color: var(--ink);
            border-radius: 50px;
            padding: 6px 14px;
            margin: 3px;
            font-size: 0.85rem;
        }

        .info-section a {
            color: var(--ink);
            font-weight: 600;
            text-decoration-color: var(--saffron);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
        }

        .info-section a:hover { color: var(--ink-2); }

        /* Back Button */
        .back-btn {
            display: inline-block;
            background-color: var(--ink);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 50px;
            transition: background 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background-color: var(--saffron);
            color: var(--ink);
        }

        /* Loading and Error */
        .message-area {
            background-color: var(--paper);
            padding: 60px 20px;
            text-align: center;
            border-radius: 28px;
            box-shadow: 0 24px 50px rgba(27, 27, 58, 0.18);
        }

        .message-area h2 {
            color: var(--ink);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        /* Footer */
        footer {
            background-color: var(--ink);
            color: #CFCEE6;
            text-align: center;
            padding: 26px;
            font-size: 0.92rem;
            margin-top: 50px;
        }

        @media (max-width: 767px) {
            .profile-header { padding: 40px 15px 100px; }
            .profile-card { padding: 22px; border-radius: 22px; }
            .profile-image { max-width: 320px; margin: 0 auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">Purrpedia</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#encyclopedia">Cat Breeds</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- Profile Header -->
    <section class="profile-header">
        <div class="container">
            <h1>Cat Breed Profile</h1>
            <p>Discover more about this feline companion.</p>
        </div>
    </section>

    <!-- Breed Profile Content -->
    <main class="profile-container">

        <div id="profileContent">

            <div class="message-area">
                <div>
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>

                    <h2>Loading Breed Profile...</h2>
                    <p>Please wait while the information is being retrieved.</p>
                </div>
            </div>

        </div>

        <div class="text-center mt-4">
            <a href="index.html#catBreeds" id="backButton" class="back-btn">
                Back to Cat Breeds
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p class="mb-0">
            &copy; 2026 Purrpedia | An Encyclopedia of Purrs and Breeds
        </p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // The Cat API settings
        const API_KEY = "live_Eh3AGnYZZoXRImiJkU9PwJvabjNMu52rtZdSHkhsdBrtHNjh2cBW3SpXMdkXMk0F";
        const API_URL = "https://api.thecatapi.com/v1";

// Get the breed ID and previous page from the URL
var urlParams = new URLSearchParams(window.location.search);

var breedID = urlParams.get("id");
var spread = urlParams.get("spread");

spread = spread == null ? 1 : parseInt(spread);
        // DOM Element
        var profileContent = document.getElementById("profileContent");
        var backButton = document.getElementById("backButton");

      // Return to the previous encyclopedia page
backButton.href = "index.html?spread=" + spread;

        // Function for API request headers
function getHeaders() {
    return {
        "x-api-key": API_KEY
    };
}
        // Function to load the selected breed
async function loadBreedDetails() {

    if (!breedID) {
        showError("No cat breed was selected.");
        return;
    }

    try {
        var response = await fetch(
            API_URL + "/breeds/" + encodeURIComponent(breedID),
            {
                method: "GET",
                headers: getHeaders()
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        var breed = await response.json();
console.log("Breed API Response:", breed);
        displayBreedDetails(breed);

    } catch (error) {
        showError(
            "Unable to retrieve the breed information. " +
            error.message
        );
    }
}
        // Function to display the breed profile
        function displayBreedDetails(breed) {

            var imageURL = "";

            // Get the breed image if available
            if (breed.image && breed.image.url) {

                imageURL = breed.image.url;

            } else if (breed.reference_image_id) {

                imageURL =
                    "https://cdn2.thecatapi.com/images/" +
                    breed.reference_image_id + ".jpg";

            } else {

                imageURL = "https://placehold.co/600x400?text=No+Image";

            }

// Get the breed information
var name = breed.name || "Unknown";
var description = breed.description || "No description available.";
var origin = breed.origin || "Not specified";
var temperament = breed.temperament || "Not specified";
var lifeSpan = breed.life_span || "Not specified";
var weight = "Not specified";

var breedGroup = breed.breed_group || "Not specified";
var bredFor = breed.bred_for || "Not specified";
var altNames = breed.alt_names || "Not specified";
var history = breed.history || "No history available.";

var countryCode = breed.country_code || "Not specified";
var experimental = breed.experimental;
var speciesID = breed.species_id || "Not specified";

// Get weight in metric units
if (breed.weight && breed.weight.metric) {
    weight = breed.weight.metric + " kg";
}

// Get VeNom Classification
var venomClassification = "Not specified";

if (breed.venom_codes && breed.venom_codes.length > 0) {

    venomClassification = breed.venom_codes.map(function(item) {
        return item.name + " (" + item.code + ")";
    }).join(", ");

}
            if (breed.weight && breed.weight.metric) {
                weight = breed.weight.metric + " kg";
            }

            // Display the breed profile
            profileContent.innerHTML = `

                <div class="profile-card">

                    <div class="row g-4 align-items-start">

                        <!-- Cat Image -->
                        <div class="col-lg-5">

                            <img
                                src="${imageURL}"
                                alt="${escapeHTML(name)}"
                                class="profile-image"
                                onerror="this.src='https://placehold.co/600x400?text=No+Image'"
                            >

                        </div>

                        <!-- Basic Information -->
                        <div class="col-lg-7">

                            <h2 class="breed-name">
                                ${escapeHTML(name)}
                            </h2>

                            <p class="breed-description">
                                ${escapeHTML(description)}
                            </p>

<div class="info-section">

    <h3>General Information</h3>

    <div class="row">

        ${createInfoItem("Name", name, "col-md-6")}

        ${createInfoItem("Origin", origin, "col-md-6")}

        ${createInfoItem("Life Span", lifeSpan + " years", "col-md-6")}

        ${createInfoItem("Weight", weight, "col-md-6")}

        ${createInfoItem("Temperament", temperament, "col-12")}

        ${createInfoItem("Description", description, "col-12")}

    </div>

</div>

                        </div>

                    </div>

                <!-- Breed Background -->
<div class="info-section">

    <h3>Breed Background</h3>

    <div class="row">

        ${createInfoItem("Breed Group", breedGroup, "col-md-6")}

        ${createInfoItem("Bred For", bredFor, "col-md-6")}

        ${createInfoItem("Alternative Names", altNames, "col-12")}

        ${createInfoItem("History", history, "col-12")}

    </div>

</div>
                 <!-- Additional Details -->
<div class="info-section">

    <h3>Additional Details</h3>

    <div class="row">

        ${createInfoItem("Country Code", countryCode, "col-md-4")}

        ${createInfoItem("Experimental", getYesNo(experimental), "col-md-4")}

        ${createInfoItem("Species ID", speciesID, "col-md-4")}

        ${createInfoItem("VeNom Classification", venomClassification, "col-12")}

    </div>

</div>

                    <!-- Breed Reference -->
                    <div class="info-section">

                        <h3>Learn More</h3>

                        <p>
                            <strong>Wikipedia:</strong>
                            ${
                                breed.wikipedia_url
                                ? `<a href="${escapeHTML(breed.wikipedia_url)}" target="_blank" rel="noopener noreferrer">Read more about ${escapeHTML(name)}</a>`
                                : "No reference available."
                            }
                        </p>

                        <p>
                            <strong>Breed ID:</strong>
                            ${escapeHTML(breed.id)}
                        </p>

                    </div>

                </div>

            `;
        }

        // Function to create an information item
        function createInfoItem(label, value, columnClass = "col-12") {

            return `
                <div class="${columnClass} info-item">

                    <span class="info-label">
                        ${escapeHTML(label)}
                    </span>

                    <span class="info-value">
                        ${escapeHTML(value)}
                    </span>

                </div>
            `;
        }

function getYesNo(value) {

    if (value === undefined || value === null) {
        return "Not specified";
    }

    return value === true || value == 1 ? "Yes" : "No";
}

        // Function to prevent HTML characters from being interpreted as markup
        function escapeHTML(value) {

            return String(value).replace(/[&<>"']/g, function(character) {

                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[character];

            });
        }

        // Function to display an error message
        function showError(message) {

            profileContent.innerHTML = `
                <div class="message-area">

                    <div>
                        <h2>Unable to Load Breed Profile</h2>

                        <p>${escapeHTML(message)}</p>

                        <a href="index.html" class="back-btn mt-3">
                            Return to Encyclopedia
                        </a>
                    </div>

                </div>
            `;
        }

        // Load the selected breed
        loadBreedDetails();
    </script>

</body>
</html>
